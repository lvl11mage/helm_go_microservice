apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: payment-service
        imagePullPolicy: Never
        env: 
          - name: URL
            valueFrom:
              secretKeyRef:
                name: rabbitmq-secret
                key:  rabbitmq-url
