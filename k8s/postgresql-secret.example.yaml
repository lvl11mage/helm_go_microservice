apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
type: Opaque
data:
  # PLEASE ENTER YOUR OWN VALUES ENCODED IN BASE64 HERE
  # Example encode command: echo -n "yourpassword" | base64
  
  database-url: <BASE64_DATABASE_URL_HERE>
  postgre-db: <BASE64_DB_NAME_HERE>
  postgre-password: <BASE64_PASSWORD_HERE>