apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  labels:
    app: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
      - name: shipping
        image: shipping-service
        imagePullPolicy: Never
        env: 
          - name: URL
            valueFrom:
              secretKeyRef:
                name: rabbitmq-secret
                key:  rabbitmq-url
