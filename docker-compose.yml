services:
  catalog-service:
    image: catalog-service
    pull_policy: never
    container_name: catalog-service
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
      target: runner
    ports:
      - 8080:8080

  order-service:
    image: order-service
    pull_policy: never
    container_name: order-service
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - 8081:8081
    env_file:
      - ./postgre/.env
    depends_on:
      postgresql:
        condition: service_healthy
      

  postgresql:
    image: postgres
    container_name: order-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/
    env_file:
      - ./postgre/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: